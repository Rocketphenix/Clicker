<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>clicker</title>

		<link
			rel="shortcut icon"
			href="Image/Ennemie/Blob/Normal/Blob.png"
			type="image/x-icon"
		/>
		<link rel="stylesheet" href="index.css" />

		<script
			type="text/javascript"
			src="http://ajax.googleapis.com/ajax/libs/jquery/1.8/jquery.min.js"
		></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/EaselPlugin.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/PixiPlugin.min.js"></script>
		<script type="module" src="compte.js"></script>
		<script type="module" src="index.js"></script>
	</head>
	<body>
		<aside>
			<div class="multiple">
				<button id="multiplieur1" class="choix active" value="1">1</button>
				<button id="multiplieur2" class="choix" value="5">5</button>
				<button id="multiplieur3" class="choix" value="10">10</button>
				<button id="multiplieur4" class="choix" value="100">100</button>
			</div>

			<div class="bonus">
				<button id="btnUpgrade"></button>
				<button id="btnBonus1"></button>
				<button id="btnBonus2"></button>
				<button id="btnBonus3"></button>
				<button id="btnBonus4"></button>
			</div>
		</aside>

		<main id="zoneDeClick">
			<p id="labelTimer"></p>
			<div id="fondTimer"><div id="timer"></div></div>
			<p id="labelVie"></p>
			<div class="fondVie"><div id="vie"></div></div>
			<p id="affichageNombreDeMonstreTuee"></p>
			<button class="clicable">
				<img id="monster" src="" alt="Monstre" />
			</button>

			<div id="stat">
				<p id="chiffre"></p>
				<p id="degatsParSeconde"></p>
			</div>
		</main>

		<section>
			<div class="btnSwitchMenu">
				<button id="btnEcranPerso"></button>
				<button id="btnEcranSucces"></button>
				<button id="btnCompte"></button>
			</div>
			<div id="ecranDroit"></div>
		</section>

		<footer>
			<div id="textDegatsBonus"></div>
			<div id="AffichageZone"></div>
		</footer>

		<nav>
			<button id="menuBonus">Bonus</button>
			<button id="menuMenu">Menu</button>
			<button id="menuPerso">Personnage</button>
		</nav>
	</body>
</html>
